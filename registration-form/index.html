<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id="form">
        <h1>Создать аккаунт</h1>

        <label for="name">Имя</label>
        <input type="text" class="input" placeholder="Введите имя" id="nameInput">
        <label for="email">Email</label>
        <input type="email" class="input" placeholder="Введите email" id="emailInput">
        <label for="password">Пароль</label>
        <input type="password" class="input" placeholder="Введите пароль" id="passwordInput">
        <button class="btn" type="submit">Зарегистрироваться</button>

        <p id="result"></p>
    </form>
    

    <script src="script.js"></script>
</body>
</html>
